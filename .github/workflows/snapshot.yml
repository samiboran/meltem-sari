# Copies all content + photos from the old Sanity project into this repo
# (src/content/content.json + public/media/). Runs automatically once when
# this file is first pushed; can be re-run any time from the Actions tab.
name: Snapshot content from Sanity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snapshot.yml
      - scripts/snapshot.mjs

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/snapshot.mjs
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add src/content public/media
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Snapshot content and images from Sanity"
          git push
